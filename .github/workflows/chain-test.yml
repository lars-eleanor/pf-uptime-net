name: chain-test
on:
  workflow_dispatch:
    inputs:
      depth:
        required: false
        default: '0'
permissions:
  contents: read
  actions: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: report and self-dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          A="${{ github.event.inputs.depth }}"
          B="${{ inputs.depth }}"
          echo "RECEIVED github.event.inputs.depth=[$A] inputs.depth=[$B]"
          D="${B:-0}"
          if [ "$D" -lt 2 ]; then
            N=$(( D + 1 ))
            if gh workflow run chain-test.yml --repo "${{ github.repository }}" -f depth="$N"; then
              echo "SELF_DISPATCH_OK depth=$N"
            else
              echo "SELF_DISPATCH_FAILED"
            fi
          else
            echo "CHAIN_END"
          fi
